# Nginx — site vitrine ProDigital.
# Le TLS (HTTPS) est terminé par le proxy de Coolify (Traefik/Caddy) ;
# ce conteneur ne sert que du HTTP interne sur le port 8080.

server_tokens off;

# IP réelle du visiteur dans les logs (requêtes relayées par le proxy Coolify).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080 default_server;
    server_name _;

    # Domaine canonique et suppression du slash final (hors accueil).
    if ($host = www.pro-digital.net) { return 301 https://pro-digital.net$request_uri; }
    rewrite ^(.+)/$ $1 permanent;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives : évite d'exposer le port interne :8080 derrière le proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    # Sonde de santé (Coolify / Docker).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API du formulaire de contact (service `api`, même origine que le site).
    # Résolution DNS à la requête : le site démarre et reste servi même si l'API est
    # arrêtée (le formulaire propose alors l'envoi par e-mail).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $contact_api http://api:8788;
        client_max_body_size 64k;
        proxy_pass $contact_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    # Fichiers cachés (.git, .env…) : jamais servis.
    location ~ /\. {
        access_log off;
        return 404;
    }

    # JS/CSS générés par Vite (nom avec hash) : cache long, immuable.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Polices (non hashées) : bon type MIME + cache d'une semaine.
    location ~* \.(?:ttf|otf)$ {
        types {
            font/ttf ttf;
            font/otf otf;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Images et autres fichiers de public/ (non hashés) : cache d'une semaine.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    error_page 404 /404.html;
    # Application pré-rendue : index.html jamais mis en cache pour que
    # chaque déploiement soit visible immédiatement.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }
}
